<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Multimedia</title>
</head>
<body>
	<h1>Multimedia</h1>

	<h2>Image</h2>
	<img src="https://images.unsplash.com/photo-1503676260728-1c00da094a0b?auto=format&fit=crop&w=800&q=80"
			 alt="Students learning together in a classroom" width="800">

	<h2>Audio</h2>
	<audio controls>
		<source src="https://www.w3schools.com/html/horse.ogg" type="audio/ogg">
		<source src="https://www.w3schools.com/html/horse.mp3" type="audio/mpeg">
		Your browser does not support the audio element.
	</audio>

	<h2>Video</h2>
	<video controls width="640" poster="https://images.unsplash.com/photo-1503676260728-1c00da094a0b?auto=format&fit=crop&w=640&q=80">
		<source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
		Your browser does not support the video element.
	</video>

	<h2>Embedded Educational Content</h2>
	<iframe width="560" height="315"
					src="https://www.youtube.com/embed/aircAruvnKk"
					title="Introduction to neural networks"
					allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
					allowfullscreen></iframe>
</body>
</html>
