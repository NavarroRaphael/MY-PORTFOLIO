<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, inital-scale=1.0">
<meta http-equiv="X-UA-Compatible" content="ie=edge">

<title>Registration</title>

</head>

<body>
<hr><h1>Welcome</h1><hr>
<hr>
<div class="form-container">
 <form action="Register_backend.js" method="post">
    <label for="name">Full name</label>
    <input type="text" id="name" name="name" required>
    
    <label for="StudentID">Student ID</label>
    <input type="text" id="StudentID" name="Student ID" required>

    <label for="email">Email</label>
    <input type="email" id="email" name="email" required>

    <label for="Password">Password</label>
    <input type="Password" id="Password" name="Password" required>

    <label for="Birthdate">Birthdate</label>
    <input type="text" id="Birthdate" name="Birthdate" required>
    
    <label for="Gender">Gender</label>
    <input type="text" id="Gender" name="Gender">

    <hr><h4> Choose your Program (choose one)</h4>
    
    <select name="Program" id="Courses">
        <optgroup value="CITCS" label="CITCS Programs">
        <option value="Web Development">Web Development</option>
        <option value="Database">Database</option>
        <option value="Networking">Networking</option>
        <option value="Cybersecurity">Cybersecurity</option>
        </optgroup>
       
        <optgroup value="Other Courses" label="Other Courses">
            <option value="Nursing">Nursing</option>
            <option value="HRM">HRM</option>
            <option value="Education">Education</option>
            <option value="Engineering">Engineering</option>
        </optgroup>
    </select>

    <hr>
    
    <label for="Hobbies">Hobbies
    <textarea name="Hobbies" id="Hobbies"></textarea>
    </label>   
    
    <label for="Address">Address</label>
    <input type="text" id="Address" name="Adress" required>

    <label for="comments">Comments
        <textarea name="Comments" id="Comments"></textarea>
    </label>

    <button type="submit">Submit</button>
    <button type="reset">Reset</button>
 </form>
</div>
<hr>

</body>
</html>
